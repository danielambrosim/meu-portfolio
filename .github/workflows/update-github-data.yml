name: Update GitHub Data

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # diário 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch GitHub stats and write data/github.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: danielambrosim
        run: |
          node scripts/fetch-github.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/github.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/github.json
            git commit -m "chore: update GitHub stats [skip ci]"
            git push
          else
            echo "No changes"
          fi
